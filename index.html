<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedGuru Lighting Inc. | 多伦多持牌 Master Electrician 智能电气服务平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Supabase 客户端库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased pb-16">

    <!-- 顶栏资讯 -->
    <div class="bg-slate-900 text-slate-300 text-xs py-2">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <span>⚡ ECRA/ESA License #7012013 | Master Electrician 质量把关</span>
            <a href="tel:6472869966" class="text-amber-400 font-bold hover:underline">📞 647-286-9966</a>
        </div>
    </div>

    <!-- 导航栏 -->
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="text-2xl font-black text-slate-900">
                Led<span class="text-amber-500">Guru</span> <span class="text-xs font-normal text-sky-600">Electrical Portal</span>
            </div>
            <button onclick="toggleLang()" class="px-3 py-1.5 text-xs font-bold border border-slate-300 rounded-full hover:bg-slate-100">
                🌐 <span id="lang-text">English</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xl overflow-hidden">
            
            <!-- 头部说明 -->
            <div class="bg-sky-900 text-white p-6 sm:p-8">
                <h1 class="text-2xl sm:text-3xl font-black mb-2" data-zh="智能报价与方案生成系统" data-en="Smart Estimate & Solution Generator">智能报价与方案生成系统</h1>
                <p class="text-sky-200 text-sm" data-zh="在线快速预估费用、解锁专业实施方案并上传现场照片获取专家确认报价" data-en="Get instant estimates, unlock custom solutions and upload photos for certified bids.">在线快速预估费用、解锁专业实施方案并上传现场照片获取专家确认报价</p>
            </div>

            <form id="quoteForm" onsubmit="handleFormSubmit(event)" class="p-6 sm:p-8 space-y-8">
                
                <!-- 模块 1：选择服务类型并实时预估 -->
                <div class="space-y-4">
                    <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-sky-100 text-sky-800 text-xs flex items-center justify-center font-black">1</span>
                        <span data-zh="选择电气服务工程类别" data-en="Select Electrical Service">选择电气服务工程类别</span>
                    </h2>
                    
                    <div class="grid sm:grid-cols-2 gap-4">
                        <label class="border border-slate-200 rounded-xl p-4 cursor-pointer hover:border-sky-500 transition flex items-start gap-3 bg-slate-50">
                            <input type="radio" name="service" value="panel" checked onclick="calculateEstimate()" class="mt-1 text-sky-600">
                            <div>
                                <div class="font-bold text-sm text-slate-900" data-zh="配电盘升级 (100A 升 200A)" data-en="Panel Upgrade (100A to 200A)">配电盘升级 (100A 升 200A)</div>
                                <div class="text-xs text-slate-500 mt-1" data-zh="适用于老宅扩容、加装热泵或 EV 充电桩" data-en="Ideal for capacity expansion & EV charging">适用于老宅扩容、加装热泵或 EV 充电桩</div>
                            </div>
                        </label>
                        <label class="border border-slate-200 rounded-xl p-4 cursor-pointer hover:border-sky-500 transition flex items-start gap-3 bg-slate-50">
                            <input type="radio" name="service" value="ev" onclick="calculateEstimate()" class="mt-1 text-sky-600">
                            <div>
                                <div class="font-bold text-sm text-slate-900" data-zh="Tesla / EV 充电桩安装" data-en="EV Charger Installation">Tesla / EV 充电桩安装</div>
                                <div class="text-xs text-slate-500 mt-1" data-zh="包含 240V 专线拉设与 ESA 合规报备" data-en="Dedicated 240V line & ESA permit">包含 240V 专线拉设与 ESA 合规报备</div>
                            </div>
                        </label>
                        <label class="border border-slate-200 rounded-xl p-4 cursor-pointer hover:border-sky-500 transition flex items-start gap-3 bg-slate-50">
                            <input type="radio" name="service" value="lighting" onclick="calculateEstimate()" class="mt-1 text-sky-600">
                            <div>
                                <div class="font-bold text-sm text-slate-900" data-zh="全屋 LED 筒灯与智能照明" data-en="Smart LED Pot Light Retrofit">全屋 LED 筒灯与智能照明</div>
                                <div class="text-xs text-slate-500 mt-1" data-zh="无缝开孔、现代极简智能调光控制" data-en="Seamless installation & smart dimming">无缝开孔、现代极简智能调光控制</div>
                            </div>
                        </label>
                        <label class="border border-slate-200 rounded-xl p-4 cursor-pointer hover:border-sky-500 transition flex items-start gap-3 bg-slate-50">
                            <input type="radio" name="service" value="rewiring" onclick="calculateEstimate()" class="mt-1 text-sky-600">
                            <div>
                                <div class="font-bold text-sm text-slate-900" data-zh="铝线 (Aluminum) 排查与整改" data-en="Aluminum Wiring Remediation">铝线 (Aluminum) 排查与整改</div>
                                <div class="text-xs text-slate-500 mt-1" data-zh="消除火灾隐患，提供保险公司认可安全证明" data-en="Fire hazard elimination & insurance approval">消除火灾隐患，提供保险公司认可安全证明</div>
                            </div>
                        </label>
                    </div>

                    <!-- 动态预估显示 -->
                    <div class="bg-sky-50 rounded-xl p-4 border border-sky-100 flex justify-between items-center">
                        <span class="text-xs font-bold text-sky-900" data-zh="初步预算范围参考：" data-en="Estimated Cost Range:">初步预算范围参考：</span>
                        <span id="priceDisplay" class="text-lg font-black text-sky-700">$1,800 - $3,200 CAD</span>
                    </div>
                </div>

                <!-- 模块 2：项目细节与联系方式 -->
                <div class="space-y-4 pt-4 border-t border-slate-100">
                    <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-sky-100 text-sky-800 text-xs flex items-center justify-center font-black">2</span>
                        <span data-zh="填写项目需求与联系方式" data-en="Requirements & Contact Information">填写项目需求与联系方式</span>
                    </h2>

                    <div>
                        <textarea id="reqDesc" rows="3" placeholder="请简述房屋类型（如独立屋/半独立）、房屋建造年份以及具体要求..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 outline-none"></textarea>
                    </div>

                    <div class="grid sm:grid-cols-2 gap-4">
                        <input type="text" id="clientName" required placeholder="您的姓名 *" class="p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 outline-none">
                        <input type="tel" id="clientPhone" required placeholder="联系电话 *" class="p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                    <input type="email" id="clientEmail" placeholder="电子邮箱（用于接收正式报价书单与施工方案）" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 outline-none">
                </div>

                <!-- 模块 3：现场资料上传与服务模式 -->
                <div class="space-y-4 pt-4 border-t border-slate-100">
                    <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-sky-100 text-sky-800 text-xs flex items-center justify-center font-black">3</span>
                        <span data-zh="现场照片上传与服务模式" data-en="Photos Upload & Service Option">现场照片上传与服务模式</span>
                    </h2>

                    <div class="border-2 border-dashed border-slate-300 rounded-2xl p-6 text-center bg-slate-50 hover:bg-slate-100 transition cursor-pointer" onclick="document.getElementById('fileInput').click()">
                        <div class="text-2xl mb-1">📸</div>
                        <div class="text-xs font-bold text-slate-700" data-zh="点击选择或上传配电盘/施工现场照片" data-en="Click to select photos of your electric panel">点击选择或上传配电盘/施工现场照片</div>
                        <div id="fileStatus" class="text-[10px] text-slate-400 mt-1" data-zh="支持多图上传，助力专家快速精确报价" data-en="Support multiple photos for accurate quote">支持多图上传，助力专家快速精确报价</div>
                        <input type="file" multiple class="hidden" id="fileInput" onchange="updateFileCount()">
                    </div>

                    <!-- 模式选择 -->
                    <div class="p-4 bg-amber-50 rounded-xl border border-amber-200 space-y-2">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="radio" name="bid_option" value="direct" checked class="text-amber-600">
                            <span class="text-xs font-bold text-slate-900" data-zh="由 LedGuru 电工专家亲自接单与现场施工 (推荐)" data-en="Direct service by LedGuru Master Electrician (Recommended)">由 LedGuru 电工专家亲自接单与现场施工 (推荐)</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="radio" name="bid_option" value="marketplace" class="text-amber-600">
                            <span class="text-xs font-bold text-slate-900" data-zh="同时发布到 LedGuru 认证持牌承包商竞价池，获取多家方案对比" data-en="Post to certified contractor pool for multiple competitive bids">同时发布到 LedGuru 认证持牌承包商竞价池，获取多家方案对比</span>
                        </label>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl shadow-lg transition text-base" data-zh="🚀 提交工程需求并获取专业方案与正式报价" data-en="🚀 Submit Requirements & Request Formal Contract">
                    🚀 提交工程需求并获取专业方案与正式报价
                </button>
            </form>
        </div>
    </main>

    <script>
        // Supabase 配置参数
        const SUPABASE_URL = 'https://pntsrmfqtvxebembczwx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_arJ0MiughCVia4Yyw0pDug_Cw68o2VL'; // “您可以把刚刚复制的 publishable key 完整粘贴在这里”
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const prices = {
            panel: '$1,800 - $3,200 CAD',
            ev: '$700 - $1,400 CAD',
            lighting: '$1,200 - $2,500 CAD',
            rewiring: '$1,500 - $4,000 CAD'
        };

        function calculateEstimate() {
            const selected = document.querySelector('input[name="service"]:checked').value;
            document.getElementById('priceDisplay').innerText = prices[selected];
        }

        function updateFileCount() {
            const files = document.getElementById('fileInput').files;
            if(files.length > 0) {
                document.getElementById('fileStatus').innerText = `已选择 ${files.length} 个文件准备上传`;
                document.getElementById('fileStatus').className = 'text-[10px] text-emerald-600 font-bold mt-1';
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = '⏳ 正在加密上传数据与照片至云端...';

            try {
                const serviceType = document.querySelector('input[name="service"]:checked').value;
                const estPrice = document.getElementById('priceDisplay').innerText;
                const requirements = document.getElementById('reqDesc').value;
                const name = document.getElementById('clientName').value;
                const phone = document.getElementById('clientPhone').value;
                const email = document.getElementById('clientEmail').value;
                const serviceOption = document.querySelector('input[name="bid_option"]:checked').value;
                const files = document.getElementById('fileInput').files;

                let photoUrls = [];

                // 1. 如果有上传照片，先传到 Supabase Storage
                if (files.length > 0) {
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        const fileName = `${Date.now()}_${file.name}`;
                        const { data, error } = await supabaseClient.storage
                            .from('site-photos')
                            .upload(fileName, file);

                        if (error) throw error;

                        // 获取公开访问 URL
                        const { data: publicURL } = supabaseClient.storage
                            .from('site-photos')
                            .getPublicUrl(fileName);

                        photoUrls.push(publicURL.publicUrl);
                    }
                }

                // 2. 将表单数据写入 quotes 数据表
                const { error: dbError } = await supabaseClient
                    .from('quotes')
                    .insert([
                        {
                            service_type: serviceType,
                            estimated_price: estPrice,
                            requirements: requirements,
                            client_name: name,
                            client_phone: phone,
                            client_email: email,
                            service_option: serviceOption,
                            photo_urls: photoUrls
                        }
                    ]);

                if (dbError) throw dbError;

                alert('🎉 提交成功！您的项目需求、照片与方案已成功录入 LedGuru 云端专家系统，我们将尽快与您联系！');
                document.getElementById('quoteForm').reset();
                document.getElementById('fileStatus').innerText = '支持多图上传，助力专家快速精确报价';
                calculateEstimate();

            } catch (err) {
                console.error(err);
                alert('提交过程中出现小插意：' + err.message + '\n请检查网络或稍后重试。');
            } finally {
                btn.disabled = false;
                btn.innerText = '🚀 提交工程需求并获取专业方案与正式报价';
            }
        }

        // 双语切换
        let lang = 'zh';
        function toggleLang() {
            lang = lang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-text').innerText = lang === 'zh' ? 'English' : '中文';
            document.querySelectorAll('[data-zh]').forEach(el => {
                const txt = el.getAttribute(`data-${lang}`);
                if(txt) el.innerText = txt;
            });
        }
    </script>
</body>
</html>
